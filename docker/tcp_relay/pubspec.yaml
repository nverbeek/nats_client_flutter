name: nats_tcp_relay
description: >-
  Serves the NATS Client UI web build and relays browser WebSocket
  connections to NATS servers over plain TCP. Used only by the Docker image.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  dart_nats: ^1.7.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  http: ^1.2.0
  lints: ^6.1.0
  test: ^1.25.8
