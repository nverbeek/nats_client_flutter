// Test-only fixture for integration_test/authentication_test.dart. Not a
// real credential — throwaway usernames/passwords for a disposable CI
// container. The second user is denied `forbidden.>` so the app's
// permission-denied handling can be checked against a real server refusal.
port: 4222
authorization {
  users = [
    { user: "integration-test-user", password: "integration-test-pass" }
    {
      user: "integration-test-restricted"
      password: "integration-test-pass"
      permissions: {
        publish: { deny: ["forbidden.>"] }
        subscribe: { deny: ["forbidden.>"] }
      }
    }
  ]
}
